[project]
name = "b2b-tender"
version = "0.1.0"
description = "Светофор рисков: проверка закупочной документации по чек-листу"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8",
]

[project.optional-dependencies]
# Извлечение текста, OCR и анализ (воркеры ingest, ocr, analysis)
ml = [
    "pymupdf>=1.25",
    "python-docx>=1.2",
    "lxml>=5.2",
    "numpy>=1.26",
    "opencv-python-headless>=4.10",
    "rapidfuzz>=3.9",
    "httpx>=0.27",
    "olefile>=0.47",
]
# Bi-encoder для эмбеддингов: веса скачиваются при сборке образа
embeddings = [
    "sentence-transformers>=3.0",
]
# Векторный поиск по таблице chunk
pg = [
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
]
# Слой данных: таблицы, миграции, функции для API и задач Celery (каталог db/)
db = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "argon2-cffi>=23.1",
]
# HTTP API (каталог api/) и задачи Celery (каталог worker/). Образ API лёгкий: без torch, OpenCV и
# Tesseract; pymupdf, lxml и olefile нужны только для ml.check_file (проверка файла при загрузке)
api = [
    "fastapi>=0.121",
    "uvicorn[standard]>=0.30",
    "PyJWT>=2.8",
    "python-multipart>=0.0.9",
    "minio>=7.2",
    "celery[redis]>=5.4",
    "redis>=5.0",
    "pymupdf>=1.25",
    "lxml>=5.2",
    "olefile>=0.47",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["contracts*", "ml*", "db*", "api*", "worker*"]

[tool.setuptools.package-data]
"ml.checklist" = ["*.json"]
"db" = ["alembic.ini", "migrations/*.py", "migrations/*.mako", "migrations/versions/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:builtin type .* has no __module__ attribute:DeprecationWarning"]
markers = [
    "tesseract: нужен Tesseract с языками rus и eng",
    "soffice: нужен LibreOffice (soffice) в PATH",
    "slow: долгий тест, например с загрузкой модели",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
