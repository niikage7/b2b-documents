# Светофор рисков: окружение целиком. Запуск: docker compose up --build
# Значения берутся из .env (шаблон — .env.example); без .env подставляются безопасные для разработки.
# Состав растёт по этапам: здесь БД, Redis, MinIO, API, воркеры Celery и заглушка LLM; Flower и фронтенд
# добавляются позже.

name: b2b

x-healthcheck-defaults: &hc
  interval: 5s
  timeout: 5s
  retries: 20

# Окружение воркеров: БД, брокер, MinIO и настройки ML.
# LLM по умолчанию — заглушка llm-stub (бесплатно, без ключа). Настоящая модель включается в .env:
# LLM_BASE_URL, LLM_MODEL и LLM_API_KEY провайдера, например OpenRouter
x-worker-env: &worker-env
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-b2b}:${POSTGRES_PASSWORD:-b2b}@db:5432/${POSTGRES_DB:-b2b}
  REDIS_URL: redis://redis:6379/0
  MINIO_ENDPOINT: minio:9000
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-b2b-minio}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-b2b-minio-secret}
  MINIO_BUCKET: ${MINIO_BUCKET:-b2b-documents}
  ML_MAX_PAGES: ${ML_MAX_PAGES:-500}
  OCR_LANG: ${OCR_LANG:-rus+eng}
  OCR_DPI: ${OCR_DPI:-300}
  OCR_PAGES_PER_TASK: ${OCR_PAGES_PER_TASK:-5}
  UNPACK_MAX_MB: ${UNPACK_MAX_MB:-500}
  UNPACK_MAX_FILES: ${UNPACK_MAX_FILES:-500}
  UNPACK_MAX_DEPTH: ${UNPACK_MAX_DEPTH:-3}
  EMBEDDING_DEVICE: cpu
  LLM_BASE_URL: ${LLM_BASE_URL:-http://llm-stub:8080/v1}
  # Своё имя модели у заглушки: кеш ответов LLM не перепутает её с настоящей моделью
  LLM_MODEL: ${LLM_MODEL:-stub/b2b-llm-stub}
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_META_MODEL: ${LLM_META_MODEL:-}
  LLM_TIMEOUT: ${LLM_TIMEOUT:-90}
  LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-3}
  LLM_MAX_CONCURRENCY: ${LLM_MAX_CONCURRENCY:-8}
  LLM_REASONING: ${LLM_REASONING:-none}
  LLM_CACHE: ${LLM_CACHE:-1}
  RULES_PER_GROUP: ${RULES_PER_GROUP:-4}
  TEST_RULE_TIMEOUT: ${TEST_RULE_TIMEOUT:-60}
  # Повторы временных ошибок этапа: всего попыток и база экспоненциальной паузы, с
  TASK_MAX_ATTEMPTS: ${TASK_MAX_ATTEMPTS:-3}
  TASK_RETRY_BASE_SECONDS: ${TASK_RETRY_BASE_SECONDS:-5}
  # Часовой пояс дат в Сводка.xlsx выгрузки пакета
  EXPORT_TIMEZONE: ${EXPORT_TIMEZONE:-Europe/Moscow}
  # Остановка воркера (docker compose stop/restart, stop_signal SIGQUIT): задачам даётся
  # WORKER_SOFT_SHUTDOWN_SECONDS, незаконченные возвращаются в очередь и доделываются после запуска
  WORKER_SOFT_SHUTDOWN_SECONDS: ${WORKER_SOFT_SHUTDOWN_SECONDS:-20}
  # Если воркер убит без остановки (SIGKILL, сбой хоста), Redis вернёт задачу в очередь через столько секунд
  CELERY_VISIBILITY_TIMEOUT: ${CELERY_VISIBILITY_TIMEOUT:-3600}

x-worker: &worker
  build:
    context: .
    dockerfile: worker/Dockerfile
    additional_contexts:
      ml: service:ml-base
  image: b2b-worker:local
  volumes:
    - mlcache:/var/cache/b2b-ml
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
    minio:
      condition: service_healthy
    # API при старте накатывает миграции: воркер начинает работу на готовой схеме
    api:
      condition: service_healthy
  restart: unless-stopped
  # SIGQUIT — «холодная» остановка Celery с мягким периодом: после WORKER_SOFT_SHUTDOWN_SECONDS
  # незаконченные задачи отменяются и сразу возвращаются в очередь. SIGTERM дал бы «тёплую» остановку:
  # Celery ждал бы конца задачи, Docker убил бы его, и задача вернулась бы только через visibility_timeout.
  # REMAP_SIGTERM=SIGQUIT не подходит: процессы пула игнорируют SIGQUIT и отмена задачи не срабатывает
  stop_signal: SIGQUIT
  # Больше WORKER_SOFT_SHUTDOWN_SECONDS: Docker не добивает воркер, пока тот возвращает задачи в очередь
  stop_grace_period: 45s

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-b2b}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-b2b}
      POSTGRES_DB: ${POSTGRES_DB:-b2b}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      <<: *hc
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      <<: *hc
    restart: unless-stopped

  minio:
    # Официальные образы minio/minio с Docker Hub и Quay недоступны; последний открытый выпуск
    # (2025.7.23) лежит в замороженном репозитории bitnamilegacy. S3 API полностью совместим
    image: bitnamilegacy/minio:2025.7.23-debian-12-r3
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-b2b-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-b2b-minio-secret}
      MINIO_DEFAULT_BUCKETS: ${MINIO_BUCKET:-b2b-documents}
    volumes:
      - miniodata:/bitnami/minio/data
    ports:
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      <<: *hc
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-b2b}:${POSTGRES_PASSWORD:-b2b}@db:5432/${POSTGRES_DB:-b2b}
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-b2b-minio}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-b2b-minio-secret}
      MINIO_BUCKET: ${MINIO_BUCKET:-b2b-documents}
      # Значения по умолчанию годятся только для локальной разработки: в рабочем окружении задайте свои в .env
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-in-env}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-demo}
      # Тест правила ждёт ответ воркера столько секунд и ещё 10 на очередь
      TEST_RULE_TIMEOUT: ${TEST_RULE_TIMEOUT:-60}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  # Базовый образ воркеров из ml/Dockerfile: только сборка, контейнер не запускается
  ml-base:
    build:
      context: .
      dockerfile: ml/Dockerfile
    image: b2b-ml:local
    deploy:
      replicas: 0

  # Очереди ingest, analysis и export: распаковка, извлечение текста, структура, фрагменты, анализ
  worker:
    <<: *worker
    environment:
      <<: *worker-env
      WORKER_QUEUES: ingest,analysis,export
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}

  # Очередь ocr: группы по 5 страниц скана; каждая задача распознаёт страницы в пуле до 4 потоков
  worker-ocr:
    <<: *worker
    environment:
      <<: *worker-env
      WORKER_QUEUES: ocr
      WORKER_CONCURRENCY: ${OCR_WORKER_CONCURRENCY:-2}

  # Заглушка LLM для разработки: отвечает как OpenAI chat/completions, цитаты берёт из запроса
  llm-stub:
    build:
      context: ./devtools/llm_stub
    image: b2b-llm-stub:local
    environment:
      LLM_STUB_DELAY: ${LLM_STUB_DELAY:-0}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      <<: *hc
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  miniodata:
  mlcache:
